version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=flaskcontacts
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=flaskcontacts
    volumes:
      # Esto toma tu carpeta local 'sql' y la inyecta para crear las tablas automáticamente
      - ./sql:/docker-entrypoint-initdb.d
